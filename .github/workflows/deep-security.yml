name: Deep Security (Mythril & Extended Fuzz)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  mythril-symbolic:
    name: Mythril Runtime Bytecode Symbolic Execution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with CouncilEngine submodule
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies & compile contracts
        run: |
          npm ci
          npm run compile

      - name: Pull Mythril symbolic analyzer image
        run: docker pull mythril/myth:latest

      - name: Run bounded Mythril gate on core contracts
        run: python3 scripts/run_mythril_ci.py --execution-timeout 180

      - name: Upload Mythril JSON artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mythril-symbolic-reports
          path: cache/mythril/*.mythril.json

  extended-fuzz:
    name: Extended Stateful Fuzz (Hardhat & Foundry)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with CouncilEngine submodule
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        run: npm ci

      - name: Run Hardhat multi-epoch PRNG stateful fuzz suite
        run: npm run test:fuzz

      - name: Run high-depth Foundry stateful invariant campaign
        run: FOUNDRY_INVARIANT_RUNS=512 forge test --match-path "test/foundry/*.t.sol" -vv

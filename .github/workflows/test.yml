name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  hardhat:
    name: Hardhat test suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npm run compile

      - name: Run tests
        run: npm test

      - name: Run local readiness check
        run: node scripts/check-readiness.js --env local

      - name: Validate deployment templates
        run: npm run check:deployment-template

      - name: Run Solhint linter
        run: npx --no-install solhint "contracts/**/*.sol"

      - name: Build frontend dashboard
        run: npm run build:dashboard

      - name: Run frontend & brand compliance linter
        run: node scripts/check-frontend-build.js
